# Usage in a project's .pre-commit-config.yaml:
#
#   - repo: https://github.com/lvalverdeb/spaghetti
#     rev: v1.5.0
#     hooks:
#       - id: spaghetti
#         args: ["--diff-base", "HEAD"]   # optional: only changed lines
#
- id: spaghetti
  name: spaghetti (structural code smells)
  description: "Scan for god classes, import cycles, duplicated bodies and other structural smells; reads [tool.spaghetti] from pyproject.toml."
  entry: spaghetti
  language: python
  types: [python]
  pass_filenames: false
  require_serial: true
  minimum_pre_commit_version: "3.0.0"
